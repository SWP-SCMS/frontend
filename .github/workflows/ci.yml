name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:course-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: course-ui-failure-${{ github.event_name }}
          path: |
            test-results/
            playwright-report/
